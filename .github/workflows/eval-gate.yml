name: Retrieval gate

# Runs the v2 retrieval eval on the sample corpus and fails the build if it drops below
# eval/thresholds.json. Needs the EDGAR_USER_AGENT secret (SEC fair-access policy) to
# download the corpus; forks without it skip the job rather than fail.
on:
  push:
    branches: [main, experiment/accuracy-redesign]
  pull_request:
  workflow_dispatch:

jobs:
  retrieval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check for corpus credentials
        id: creds
        env:
          UA: ${{ secrets.EDGAR_USER_AGENT }}
        run: echo "ok=$([ -n "$UA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v5
        if: steps.creds.outputs.ok == 'true'
        with:
          enable-cache: true
      - name: Cache models and corpus
        if: steps.creds.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            documents
          key: eval-${{ hashFiles('eval/gold/documents.json') }}-bge-base-v1.5-reranker-v2-m3
      - name: Install
        if: steps.creds.outputs.ok == 'true'
        run: uv sync --frozen --group dev
      - name: Seed and evaluate (HTML corpus, v2 engine)
        if: steps.creds.outputs.ok == 'true'
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          LLM_PROVIDER: ollama
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          TOKENIZERS_PARALLELISM: "false"
        run: |
          uv run python -m scripts.seed_demo --engine v2
          uv run python -m eval.retrieval --modes v2 --k 8 --tag ci
      - name: Gate
        if: steps.creds.outputs.ok == 'true'
        run: uv run python -m eval.gate eval/results/retrieval_ci.json --corpus html
      - uses: actions/upload-artifact@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          name: retrieval-eval
          path: eval/results/retrieval_ci.json
      - name: Skipped
        if: steps.creds.outputs.ok != 'true'
        run: echo "EDGAR_USER_AGENT secret not available (fork?) — retrieval gate skipped"
