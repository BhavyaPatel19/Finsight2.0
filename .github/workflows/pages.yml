name: Demo site

# Publishes the React app as a recorded demo on GitHub Pages: with VITE_DEMO=1 the API client
# answers from frontend/public/demo/recordings.json (see frontend/src/api/demo.js) instead of a
# server, because the backend needs three local models and an LLM provider.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Require recordings
        run: test -f public/demo/recordings.json || { echo "record first: see README, Recorded demo"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build demo
        env:
          VITE_DEMO: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm run build
          cp dist/index.html dist/404.html   # client-side routes on deep links
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
